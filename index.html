
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9th Class Punjab Board - Study Portal</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#f1f5f9;color:#172033
}
header{
 background:linear-gradient(135deg,#064e3b,#047857);
 color:white;text-align:center;padding:25px 12px
}
header h1{margin:0 0 10px;font-size:25px}
header p{margin:5px}
.container{max-width:950px;margin:auto;padding:15px}
.panel{
 background:white;padding:16px;border-radius:13px;
 margin:14px 0;box-shadow:0 2px 10px #00000012
}
h2{font-size:21px;margin-top:5px}
.subjects{
 display:grid;grid-template-columns:repeat(2,1fr);gap:10px
}
button{
 border:0;border-radius:9px;padding:13px;
 font-size:16px;cursor:pointer
}
.subject{
 background:#e0f2fe;color:#075985;font-weight:bold
}
.subject.active{background:#047857;color:white}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{background:#e2e8f0;color:#172033;flex:1}
.tab.active{background:#0f766e;color:white}
input{
 width:100%;padding:13px;border:1px solid #cbd5e1;
 border-radius:9px;font-size:16px;margin:10px 0
}
.question{
 background:#f8fafc;border:1px solid #e2e8f0;
 border-radius:10px;padding:14px;margin:12px 0
}
.question h3{font-size:17px;margin:0 0 12px}
.answer{
 background:#ecfdf5;padding:12px;border-radius:8px;
 margin-top:10px;line-height:1.8
}
.show{background:#0f766e;color:white;padding:8px 13px}
.notice{
 background:#fff7ed;border-right:4px solid #f59e0b;
 padding:12px;line-height:1.8;border-radius:7px
}
footer{text-align:center;padding:20px;color:#64748b}
@media(max-width:450px){
 .subjects{grid-template-columns:1fr}
 header h1{font-size:21px}
}
</style>
</head>
<body>

<header>
 <h1>نویں جماعت پنجاب بورڈ</h1>
 <p>9th Class Complete Study Portal</p>
 <p>تمام مضامین ایک ہی ویب سائٹ میں</p>
</header>

<div class="container">

 <section class="panel">
  <h2>📚 اپنی کتاب منتخب کریں</h2>
  <div class="subjects" id="subjects"></div>
 </section>

 <section class="panel">
  <h2 id="bookTitle">کتاب منتخب کریں</h2>

  <div class="notice">
   اس ویب سائٹ میں ہر کتاب کے لیے MCQs، مختصر سوالات
   اور تفصیلی سوالات کے الگ حصے ہیں۔
  </div>

  <input id="search" type="search"
   placeholder="سوال تلاش کریں..." oninput="renderQuestions()">

  <div class="tabs">
   <button class="tab active" onclick="setType('mcq',this)">MCQs</button>
   <button class="tab" onclick="setType('short',this)">مختصر سوالات</button>
   <button class="tab" onclick="setType('long',this)">تفصیلی سوالات</button>
  </div>

  <p id="count">کتاب منتخب کریں</p>
  <div id="questionList"></div>
 </section>

</div>

<footer>
 © 2026 | 9th Class Punjab Board Study Portal
</footer>

<script>
const books = [
 "ترجمۃ القرآن",
 "اردو",
 "ریاضی",
 "کمپیوٹر سائنس",
 "کیمسٹری",
 "فزکس"
];

// ہر کتاب کے اصل سوالات یہاں شامل کیے جائیں گے۔
// خالی فہرست کا مطلب ہے کہ PDF سے قابلِ اعتماد سوالات
// ابھی حاصل نہیں ہوئے۔ فرضی سوالات نہیں دکھائے جائیں گے۔
const questionBank = {
 "ترجمۃ القرآن": {mcq:[],short:[],long:[]},
 "اردو": {mcq:[],short:[],long:[]},
 "ریاضی": {mcq:[],short:[],long:[]},
 "کمپیوٹر سائنس": {mcq:[],short:[],long:[]},
 "کیمسٹری": {mcq:[],short:[],long:[]},
 "فزکس": {mcq:[],short:[],long:[]}
};

let selectedBook = "";
let selectedType = "mcq";

const subjects = document.getElementById("subjects");

books.forEach(book=>{
 const btn=document.createElement("button");
 btn.className="subject";
 btn.textContent=book;
 btn.onclick=()=>selectBook(book,btn);
 subjects.appendChild(btn);
});

function selectBook(book,btn){
 selectedBook=book;
 document.getElementById("bookTitle").textContent=book;
 document.querySelectorAll(".subject").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 document.getElementById("search").value="";
 renderQuestions();
}

function setType(type,btn){
 selectedType=type;
 document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 renderQuestions();
}

function renderQuestions(){
 const list=document.getElementById("questionList");
 const count=document.getElementById("count");
 list.innerHTML="";

 if(!selectedBook){
  count.textContent="پہلے کتاب منتخب کریں";
  return;
 }

 const questions=questionBank[selectedBook][selectedType] || [];
 const search=document.getElementById("search").value.trim().toLowerCase();

 const filtered=questions.filter(q=>
  (q.question||"").toLowerCase().includes(search)
 );

 count.textContent="موجودہ سوالات: "+filtered.length;

 if(filtered.length===0){
  list.innerHTML=`
   <div class="notice">
    اس حصے کے اصل سوالات ابھی شامل نہیں کیے گئے۔
    آپ کی بھیجی ہوئی PDF کے صفحات اسکین شدہ ہیں،
    اس لیے سوالات اور جوابات کی درست عبارت پڑھنا ممکن نہیں ہوا۔
    <br><br>
    مطلوبہ تعداد: 
    ${selectedType==="mcq"?"50 MCQs":
      selectedType==="short"?"20 مختصر سوالات":"10 تفصیلی سوالات"}
   </div>`;
  return;
 }

 filtered.forEach((q,index)=>{
  const div=document.createElement("div");
  div.className="question";

  let html=`<h3>${index+1}. ${escapeHTML(q.question)}</h3>`;

  if(selectedType==="mcq" && q.options){
   html+="<div>";
   q.options.forEach((option,i)=>{
    html+=`<p>${String.fromCharCode(65+i)}. ${escapeHTML(option)}</p>`;
   });
   html+="</div>";
  }

  html+=`
   <button class="show" onclick="toggleAnswer(this)">جواب دیکھیں</button>
   <div class="answer" hidden>
    <b>جواب:</b> ${escapeHTML(q.answer||"جواب دستیاب نہیں")}
   </div>`;

  div.innerHTML=html;
  list.appendChild(div);
 });
}

function toggleAnswer(button){
 const answer=button.nextElementSibling;
 answer.hidden=!answer.hidden;
 button.textContent=answer.hidden?"جواب دیکھیں":"جواب چھپائیں";
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,char=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[char]);
}
</script>

</body>
</html>
