
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9th Class Punjab Board Notes 2026</title>
<style>
body{margin:0;font-family:Arial;background:#edf2f7;color:#172033}
header{background:#123c69;color:white;text-align:center;padding:25px}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:15px}
button{background:#0876bd;color:white;border:0;padding:12px;border-radius:8px;cursor:pointer}
button:hover{background:#064b7d}
.subject{max-width:950px;margin:auto;padding:15px}
.section{background:white;margin:15px 0;padding:18px;border-radius:10px}
.question{padding:12px 0;border-bottom:1px solid #ddd}
.urdu{direction:rtl;text-align:right}
.answer{color:green}
h2{color:#123c69}
</style>
</head>
<body>

<header>
<h1>9th Class Punjab Board 2026</h1>
<p>Complete Notes English + Urdu</p>
</header>

<nav id="nav"></nav>
<main id="content"></main>

<script>
const subjects=[
"Physics","Chemistry","Mathematics",
"Biology","Computer Science",
"English","Urdu","Islamiat","Tarjuma Tul Quran"
];

const bilingual=["Physics","Chemistry","Mathematics"];
const nav=document.getElementById("nav");
const content=document.getElementById("content");

subjects.forEach(subject=>{
 let b=document.createElement("button");
 b.textContent=subject;
 b.onclick=()=>show(subject);
 nav.appendChild(b);
});

function show(subject){
 content.innerHTML="";
 let page=document.createElement("div");
 page.className="subject";

 let heading=document.createElement("h2");
 heading.textContent=subject+" - Class 9";
 page.appendChild(heading);

 let languages=bilingual.includes(subject);
 let lang=languages
 ? ["English","اردو"]
 : ["English"];

 let mcqBox=document.createElement("section");
 mcqBox.className="section";
 mcqBox.innerHTML="<h2>50 MCQs</h2>";

 for(let i=1;i<=50;i++){
  lang.forEach(language=>{
   let div=document.createElement("div");
   div.className="question";
   let q=document.createElement("b");
   q.textContent=language==="اردو"
    ? `سوال نمبر ${i}: ${subject} کا سوال نمبر ${i}`
    : `MCQ ${i}: Question ${i} of ${subject}`;
   if(language==="اردو")q.className="urdu";
   div.appendChild(q);

   ["A","B","C","D"].forEach(option=>{
    let label=document.createElement("label");
    label.style.display="block";
    let input=document.createElement("input");
    input.type="radio";
    input.name=subject+"mcq"+i+language;
    input.value=option;
    label.appendChild(input);
    label.append(" Option "+option);
    div.appendChild(label);
   });

   let answer=document.createElement("p");
   answer.className="answer";
   answer.textContent=language==="اردو"
    ?"درست جواب: کتاب کے مطابق درج کریں"
    :"Correct Answer: Add textbook answer";
   div.appendChild(answer);
   mcqBox.appendChild(div);
  });
 }
 page.appendChild(mcqBox);

 let shortBox=document.createElement("section");
 shortBox.className="section";
 shortBox.innerHTML="<h2>20 Short Questions</h2>";

 for(let i=1;i<=20;i++){
  lang.forEach(language=>{
   let div=document.createElement("div");
   div.className="question";
   let q=document.createElement("b");
   q.textContent=language==="اردو"
    ?`مختصر سوال ${i}: ${subject}`
    :`Short Question ${i}: ${subject}`;
   if(language==="اردو")q.className="urdu";
   let a=document.createElement("p");
   a.className="answer";
   a.textContent=language==="اردو"
    ?"جواب: کتاب کے مطابق جواب درج کریں۔"
    :"Answer: Add the correct textbook answer.";
   div.append(q,a);
   shortBox.appendChild(div);
  });
 }
 page.appendChild(shortBox);

 let longBox=document.createElement("section");
 longBox.className="section";
 longBox.innerHTML="<h2>10 Long Questions</h2>";

 for(let i=1;i<=10;i++){
  lang.forEach(language=>{
   let div=document.createElement("div");
   div.className="question";
   let q=document.createElement("b");
   q.textContent=language==="اردو"
    ?`تفصیلی سوال ${i}: ${subject}`
    :`Long Question ${i}: ${subject}`;
   if(language==="اردو")q.className="urdu";
   let a=document.createElement("p");
   a.className="answer";
   a.textContent=language==="اردو"
    ?"جواب: کتاب کے مطابق تفصیلی جواب درج کریں۔"
    :"Answer: Add the complete textbook answer.";
   div.append(q,a);
   longBox.appendChild(div);
  });
 }
 page.appendChild(longBox);
 content.appendChild(page);
 window.scrollTo(0,0);
}

show("Physics");
</script>
</body>
</html>
