let current="";
let section="mcq";
let testAnswers={};

const subjects=document.getElementById("subjects");
Object.keys(books).forEach(name=>{
let d=document.createElement("div");
d.className="subject";
d.innerHTML=`<span>${books[name].icon}</span><h3>${name}</h3><small>سوالات اور جوابات</small>`;
d.onclick=()=>openBook(name);
subjects.appendChild(d);
});

function openBook(name){
current=name;
document.getElementById("home").classList.add("hidden");
document.getElementById("study").classList.remove("hidden");
document.getElementById("subjectTitle").textContent=books[name].icon+" "+name;
section="mcq";
render();
}
function goHome(){
document.getElementById("study").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
}
function showSection(s){
section=s;
render();
}
function render(){
let book=books[current];
let q=document.getElementById("search").value.trim();
let html="";
if(section==="mcq"||section==="short"||section==="long"){
let list=book[section];
list.forEach((item,i)=>{
let question=item[0];
if(!question.includes(q))return;
html+=`<div class="question"><b>${i+1}. ${question}</b>`;
if(section==="mcq"){
html+=item[1].map((o,j)=>`<div class="option">${String.fromCharCode(65+j)}. ${o}</div>`).join("");
html+=`<button onclick="toggleAnswer(this)">جواب دیکھیں</button><div class="answer">درست جواب: ${item[1][item[2]]}</div>`;
}else{
html+=`<button onclick="toggleAnswer(this)">جواب دیکھیں</button><div class="answer">${item[1]}</div>`;
}
html+="</div>";
});
if(!html)html="<p>کوئی سوال نہیں ملا۔</p>";
}
if(section==="test"){
html="<h2>📝 MCQs پریکٹس ٹیسٹ</h2><p>ہر سوال کا ایک درست جواب منتخب کریں۔</p>";
book.mcq.forEach((item,i)=>{
html+=`<div class="question"><b>${i+1}. ${item[0]}</b>`;
item[1].forEach((o,j)=>{
html+=`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`;
});
html+="</div>";
});
html+='<button onclick="checkTest()">نتیجہ معلوم کریں</button><div id="result"></div>';
}
document.getElementById("content").innerHTML=html;
}
function toggleAnswer(btn){
let a=btn.nextElementSibling;
a.style.display=a.style.display==="block"?"none":"block";
btn.textContent=a.style.display==="block"?"جواب چھپائیں":"جواب دیکھیں";
}
function checkTest(){
let list=books[current].mcq;
let score=0;
list.forEach((item,i)=>{
let selected=document.querySelector(`input[name="q${i}"]:checked`);
if(selected&&Number(selected.value)===item[2])score++;
});
document.getElementById("result").innerHTML=
`<div class="question"><h2>آپ کا نتیجہ</h2><h1>${score} / ${list.length}</h1><p>${score>=7?"بہت خوب! اچھی کوشش۔":"مزید پریکٹس کریں۔ آپ بہتر کر سکتے ہیں۔"}</p></div>`;
}
</script>
